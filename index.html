<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usman Video Hub</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-top: 30px;
        }
        p {
            color: #94a3b8;
        }
        .video-container {
            max-width: 800px;
            margin: 30px auto;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>خوش آمدید! - Usman Video Hub</h1>
    <p>آپ کی اپنی ویڈیو ویب سائٹ بالکل تیار ہے!</p>

    <div class="video-container">
        <!-- یہاں اپنی ویڈیو کا لنک یا فائل نام لگائیں -->
        <video controls>
            <source src="your-video.mp4" type="video/mp4">
            آپ کا براؤزر ویڈیو کو سپورٹ نہیں کرتا۔
        </video>
    </div>

</body>
</html>
